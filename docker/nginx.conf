events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream load balancing for NestJS backend API cluster
    upstream nest_api_cluster {
        least_conn;
        server api_1:4000 max_fails=3 fail_timeout=10s;
        server api_2:4000 max_fails=3 fail_timeout=10s;
    }

    # Upstream for Next.js web application
    upstream nextjs_frontend {
        server web:3000;
    }

    # Upstream for FastAPI AI & RAG service
    upstream fastapi_ai {
        server ai_service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # 1. SSE Endpoints (Server-Sent Events) - Buffering strictly disabled
        location ~* ^/api/v1/(queues/stream|notifications/stream|ai/consultation/stream) {
            proxy_pass http://nest_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Crucial for Real-Time SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
        }

        # 2. REST API Backend
        location /api/ {
            proxy_pass http://nest_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Direct AI Engine Service
        location /ai-engine/ {
            rewrite ^/ai-engine/(.*) /$1 break;
            proxy_pass http://fastapi_ai;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Next.js Frontend
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
